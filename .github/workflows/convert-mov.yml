name: mov → mp4 변환

# 매주 월요일 새벽 4시(KST)에 돌고, 필요하면 Actions 탭에서 직접 실행할 수도 있다.
on:
  schedule:
    - cron: '0 19 * * 0'
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ffmpeg 확인
        run: ffmpeg -version | head -1 || sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 변환 실행
        env:
          INONESTAR_ADMIN_PASSWORD: ${{ secrets.INONESTAR_ADMIN_PASSWORD }}
        run: node scripts/convert-mov.mjs
